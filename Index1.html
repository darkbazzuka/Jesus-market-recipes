
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P2P Vault Pro 3D</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --panel-bg: rgba(18, 22, 32, 0.45);
    --panel-border: rgba(255, 255, 255, 0.12);
    --text-color: #f0f4f8;
    --accent-color: #00f0ff;
    --accent-glow: rgba(0, 240, 255, 0.4);
    --danger-color: #ff3366;
    --log-bg: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text-color); background: #000;
  }

  #webgl-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }

  .app-container {
    position: fixed; top: 0; left: 0; z-index: 2;
    width: 100vw; height: 100vh; padding: 10px;
    display: flex; flex-direction: column;
  }

  .glass-panel {
    background: var(--panel-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--panel-border); border-radius: 16px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  }

  .header {
    padding: 8px 16px; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px; flex-shrink: 0;
  }

  .header h2 { margin: 0; font-size: 1.1rem; color: var(--accent-color); text-shadow: 0 0 12px var(--accent-glow); }

  .nav-tabs { display: flex; gap: 6px; }
  .tab-btn { padding: 6px 12px; font-size: 0.8rem; background: rgba(0,0,0,0.25); color: var(--text-color); border: 1px solid var(--panel-border); border-radius: 8px; cursor: pointer; }
  .tab-btn.active { background: var(--accent-color); color: #000; font-weight: 700; }

  .setup-screen { padding: 30px 20px; text-align: center; margin: auto; width: 100%; max-width: 420px; }

  input, button, select {
    font-family: inherit; font-size: 0.9rem; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--panel-border); outline: none;
    background: rgba(0, 0, 0, 0.3); color: var(--text-color); backdrop-filter: blur(10px);
  }

  button { background: var(--accent-color); color: #000; border: none; cursor: pointer; font-weight: 700; }
  button:active { transform: scale(0.98); }

  .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; gap: 10px; }

  .overlay-menu {
    position: absolute; top: 0; left: 0; width: 320px; height: 100%;
    z-index: 10; padding: 14px; display: none; flex-direction: column;
    overflow-y: auto; background: var(--panel-bg); backdrop-filter: blur(25px);
    border-right: 1px solid var(--panel-border);
  }
  .overlay-menu.open { display: flex; }

  .pfp-preview { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-color); }
  .pfp-small { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent-color); flex-shrink: 0; }

  .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .chat-header {
    padding: 10px 16px; border-bottom: 1px solid var(--panel-border);
    display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.2);
  }

  #log { flex: 1; overflow-y: auto; padding: 16px; background: var(--log-bg); display: flex; flex-direction: column; gap: 12px; }

  /* CHAT BUBBLES */
  .bubble-row { display: flex; gap: 10px; align-items: flex-end; max-width: 75%; }
  .bubble-row.me { align-self: flex-end; flex-direction: row-reverse; }
  .bubble-row.peer { align-self: flex-start; }

  .msg-bubble {
    padding: 10px 14px; border-radius: 14px; word-wrap: break-word; font-size: 0.9rem;
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px); position: relative;
  }
  .bubble-row.me .msg-bubble { background: var(--accent-color); color: #000; border-color: transparent; font-weight: 500; }

  .controls { padding: 10px 14px; border-top: 1px solid var(--panel-border); display: flex; gap: 8px; align-items: center; background: rgba(0, 0, 0, 0.2); }
  .controls input { margin-bottom: 0; flex: 1; }

  .btn-danger { background: var(--danger-color); color: #fff; }

  .peer-item {
    background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
  }

  /* MEDIA CALL OVERLAY */
  #media-modal {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 100; display: none;
    flex-direction: column; justify-content: center; align-items: center; gap: 15px;
  }
  .video-grid { display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; }
  video { width: 320px; height: 240px; background: #111; border-radius: 12px; border: 2px solid var(--panel-border); object-fit: cover; }
</style>
</head>
<body>

<canvas id="webgl-bg"></canvas>

<div class="app-container">
  <div class="header glass-panel">
    <h2>P2P VAULT PRO 3D</h2>
    <div class="nav-tabs" id="nav-tabs" style="display:none;">
      <button class="tab-btn" onclick="toggleMenu('peers-menu')">📡 Discover Peers</button>
      <button class="tab-btn" onclick="toggleMenu('friends-menu')">👥 Friends</button>
    </div>
  </div>

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="setup-screen glass-panel">
    <h3>Setup Profile</h3>
    <img id="pfp-setup-preview" class="pfp-preview" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2300f0ff'/></svg>" style="margin-bottom:10px;"><br>
    <label style="font-size:0.75rem; cursor:pointer; text-decoration:underline;">Choose Profile Picture
      <input type="file" id="pfp-input" accept="image/*" style="display:none;">
    </label>
    <br><br>
    <input type="text" id="username-input" placeholder="Username...">
    <button id="save-user-btn" style="width: 100%;">Initialize Vault</button>
  </div>

  <!-- MAIN APP -->
  <div id="main-screen" class="main-layout" style="display:none;">
    
    <!-- DISCOVER PEERS MENU -->
    <div id="peers-menu" class="overlay-menu glass-panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h4 style="margin:0;">ONLINE NETWORK</h4>
        <button onclick="toggleMenu('peers-menu')" style="padding:2px 8px;">✕</button>
      </div>
      <div style="font-size:0.75rem; opacity:0.7; margin-bottom:10px;">Active nodes broadcasting on network:</div>
      <div id="discovered-peers-list"></div>
    </div>

    <!-- FRIENDS MENU -->
    <div id="friends-menu" class="overlay-menu glass-panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h4 style="margin:0;">FRIENDS LIST</h4>
        <button onclick="toggleMenu('friends-menu')" style="padding:2px 8px;">✕</button>
      </div>
      <input type="text" id="add-friend-input" placeholder="Friend's Username..." style="margin-bottom:6px;">
      <button id="add-friend-btn" style="width:100%; margin-bottom:15px;">Add Friend</button>
      <div id="friends-list"></div>
    </div>

    <!-- CHAT & CALL INTERFACE -->
    <div class="chat-area glass-panel">
      
      <!-- VIDEO / VOICE CALL MODAL -->
      <div id="media-modal">
        <h3 id="call-status-text" style="margin:0; color:var(--accent-color);">Calling...</h3>
        <div class="video-grid">
          <div>
            <div style="font-size:0.75rem; margin-bottom:4px; text-align:center;">You</div>
            <video id="local-video" autoplay muted playsinline></video>
          </div>
          <div>
            <div style="font-size:0.75rem; margin-bottom:4px; text-align:center;">Remote Peer</div>
            <video id="remote-video" autoplay playsinline></video>
          </div>
        </div>
        <audio id="remote-audio" autoplay></audio>
        <button id="end-call-modal-btn" class="btn-danger" style="padding:10px 24px;">End Call</button>
      </div>

      <div class="chat-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <img id="target-pfp-display" class="pfp-small" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2300f0ff'/></svg>" style="display:none;">
          <span id="target-title" style="font-weight: 700; font-size: 0.9rem;">No Active Channel</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <button id="voice-call-btn" style="display:none; padding: 6px 10px; font-size: 0.75rem; background: #00ff88; color: #000;">🎤 Voice</button>
          <button id="video-call-btn" style="display:none; padding: 6px 10px; font-size: 0.75rem; background: #00ff88; color: #000;">📹 Video</button>
          <button id="block-btn" style="display:none; padding: 6px 10px; font-size: 0.75rem;" class="btn-danger">Block X</button>
          <button id="disc-btn" style="display:none; padding: 6px 10px; font-size: 0.75rem;" class="btn-danger">Disconnect</button>
        </div>
      </div>

      <div id="log"></div>
      
      <div id="controls" class="controls" style="display:none;">
        <input type="text" id="msg" placeholder="Write message...">
        <button id="send">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
// --- FULLSCREEN ---
function forceFullscreen() {
  const doc = document.documentElement;
  if (doc.requestFullscreen) doc.requestFullscreen().catch(() => {});
  else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
}
forceFullscreen();
window.addEventListener('DOMContentLoaded', forceFullscreen);

// --- STORAGE MANAGER ---
const STORAGE_KEY = "p2p_vault_username";
const PFP_KEY = "p2p_vault_pfp";
const FRIENDS_KEY = "p2p_vault_friends";
const BLOCKED_KEY = "p2p_vault_blocked";

function saveStorage(key, val) {
  try { document.cookie = `${key}=${encodeURIComponent(typeof val === 'object' ? JSON.stringify(val) : val)}; max-age=31536000; path=/; SameSite=Lax`; } catch(e) {}
  try { localStorage.setItem(key, typeof val === 'object' ? JSON.stringify(val) : val); } catch(e) {}
}

function loadStorage(key) {
  try {
    const match = document.cookie.match(new RegExp('(^| )' + key + '=([^;]+)'));
    if (match) return decodeURIComponent(match[2]);
  } catch(e) {}
  try {
    const val = localStorage.getItem(key);
    if (val) return val;
  } catch(e) {}
  return null;
}

// --- PFP SETUP ---
let myPfp = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2300f0ff'/></svg>";
document.getElementById('pfp-input').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    myPfp = reader.result;
    document.getElementById('pfp-setup-preview').src = myPfp;
    saveStorage(PFP_KEY, myPfp);
  };
  reader.readAsDataURL(file);
};

// --- MENU TOGGLE ---
function toggleMenu(menuId) {
  ['peers-menu', 'friends-menu'].forEach(id => {
    const el = document.getElementById(id);
    if (id === menuId) el.classList.toggle('open');
    else el.classList.remove('open');
  });
}

// --- 3D BACKGROUND REALM ---
const canvas = document.getElementById('webgl-bg');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
camera.position.z = 30;

const geometry = new THREE.BufferGeometry();
const count = 1200;
const positions = new Float32Array(count * 3);
for (let i = 0; i < count * 3; i++) positions[i] = (Math.random() - 0.5) * 100;
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const material = new THREE.PointsMaterial({ size: 0.4, color: 0x00f0ff, transparent: true, opacity: 0.8 });
scene.add(new THREE.Points(geometry, material));

function animate() {
  requestAnimationFrame(animate);
  scene.rotation.y += 0.001;
  renderer.render(scene, camera);
}
animate();

// --- P2P CORE & DISCOVERY ---
const PREFIX = "p2pvault_usr_v50_";
let myUsername = '', myId = '', peer = null, conn = null;
let localStream = null, currentCall = null;
let friendsList = [], blockedList = [], discoveredPeers = {};
let targetPeerPfp = null;

window.addEventListener('load', () => {
  const savedUser = loadStorage(STORAGE_KEY);
  const savedPfp = loadStorage(PFP_KEY);
  const savedFriends = loadStorage(FRIENDS_KEY);
  const savedBlocked = loadStorage(BLOCKED_KEY);

  if (savedPfp) { myPfp = savedPfp; document.getElementById('pfp-setup-preview').src = myPfp; }
  if (savedFriends) { try { friendsList = JSON.parse(savedFriends); } catch(e){} }
  if (savedBlocked) { try { blockedList = JSON.parse(savedBlocked); } catch(e){} }

  if (savedUser) {
    myUsername = savedUser;
    document.getElementById('setup-screen').style.display = 'none';
    startApp(myUsername);
  }
});

document.getElementById('save-user-btn').onclick = () => {
  const val = document.getElementById('username-input').value.trim();
  if (!val) return;
  myUsername = val;
  saveStorage(STORAGE_KEY, myUsername);
  document.getElementById('setup-screen').style.display = 'none';
  startApp(myUsername);
};

function startApp(uname) {
  document.getElementById('main-screen').style.display = 'flex';
  document.getElementById('nav-tabs').style.display = 'flex';
  myId = PREFIX + uname.replace(/[^a-zA-Z0-9_]/g, '');

  peer = new Peer(myId);

  peer.on('open', () => {
    log(`System initialized as "${uname}".`);
    updateFriendsUI();
    setInterval(broadcastPing, 4000);
  });

  peer.on('connection', (c) => {
    if (blockedList.includes(c.peer.replace(PREFIX, ''))) {
      c.close();
      return;
    }

    if (c.metadata && c.metadata.isPing) {
      c.on('open', () => {
        c.send({ type: 'PONG', name: c.metadata.name, pfp: myPfp });
        setTimeout(() => c.close(), 300);
      });
      return;
    }

    bindConn(c);
  });

  peer.on('call', (call) => {
    const callerName = call.peer.replace(PREFIX, '');
    if (blockedList.includes(callerName)) { call.close(); return; }

    if (confirm(`Incoming call from ${callerName}. Accept?`)) {
      navigator.mediaDevices.getUserMedia({ audio: true, video: true }).then((stream) => {
        localStream = stream;
        document.getElementById('local-video').srcObject = stream;
        call.answer(stream);
        setupCallHandlers(call);
        document.getElementById('media-modal').style.display = 'flex';
      }).catch(() => alert("Camera/Microphone access denied."));
    } else {
      call.close();
    }
  });
}

// PEER DISCOVERY SYSTEM
function broadcastPing() {
  if (!peer || peer.destroyed) return;
  // Generate pseudo slots to scan network
  for (let i = 0; i < 5; i++) {
    const testId = PREFIX + 'user' + Math.floor(Math.random() * 50);
    if (testId === myId) continue;
    try {
      const p = peer.connect(testId, { metadata: { isPing: true, name: myUsername } });
      p.on('data', (d) => {
        if (d && d.type === 'PONG') {
          const peerName = testId.replace(PREFIX, '');
          discoveredPeers[peerName] = { id: testId, pfp: d.pfp || myPfp };
          updateDiscoveredUI();
        }
      });
      setTimeout(() => { try{p.close()}catch(e){} }, 1500);
    } catch(e){}
  }
}

function updateDiscoveredUI() {
  const list = document.getElementById('discovered-peers-list');
  list.innerHTML = '';
  const keys = Object.keys(discoveredPeers);
  if (keys.length === 0) {
    list.innerHTML = '<div style="font-size:0.8rem; opacity:0.6;">Scanning for nodes...</div>';
    return;
  }
  keys.forEach(name => {
    if (blockedList.includes(name)) return;
    const data = discoveredPeers[name];
    const div = document.createElement('div');
    div.className = 'peer-item';
    div.innerHTML = `
      <div style="display:flex; align-items:center; gap:8px;">
        <img class="pfp-small" src="${data.pfp}">
        <strong>${name}</strong>
      </div>
      <button onclick="connectToPeer('${name}', '${data.id}', '${data.pfp}')" style="padding:4px 8px; font-size:0.75rem;">Connect</button>
    `;
    list.appendChild(div);
  });
}

// FRIENDS SYSTEM
document.getElementById('add-friend-btn').onclick = () => {
  const name = document.getElementById('add-friend-input').value.trim();
  if (!name || friendsList.includes(name)) return;
  friendsList.push(name);
  saveStorage(FRIENDS_KEY, friendsList);
  updateFriendsUI();
  document.getElementById('add-friend-input').value = '';
};

function updateFriendsUI() {
  const list = document.getElementById('friends-list');
  list.innerHTML = '';
  friendsList.forEach(name => {
    if (blockedList.includes(name)) return;
    const div = document.createElement('div');
    div.className = 'peer-item';
    div.innerHTML = `
      <div style="display:flex; align-items:center; gap:8px;">
        <img class="pfp-small" src="${myPfp}">
        <strong>${name}</strong>
      </div>
      <button onclick="connectToPeer('${name}', '${PREFIX + name}', '${myPfp}')" style="padding:4px 8px; font-size:0.75rem;">Chat</button>
    `;
    list.appendChild(div);
  });
}

// CONNECTION & CHAT
function connectToPeer(name, id, pfp) {
  targetPeerPfp = pfp;
  document.getElementById('target-title').innerText = name;
  const pfpDisp = document.getElementById('target-pfp-display');
  pfpDisp.src = pfp;
  pfpDisp.style.display = 'inline-block';

  toggleMenu('');
  const c = peer.connect(id);
  bindConn(c, true);
}

function bindConn(c, isInitiator = false) {
  conn = c;
  const peerName = c.peer.replace(PREFIX, '');

  conn.on('open', () => {
    document.getElementById('controls').style.display = 'flex';
    document.getElementById('disc-btn').style.display = 'inline-block';
    document.getElementById('voice-call-btn').style.display = 'inline-block';
    document.getElementById('video-call-btn').style.display = 'inline-block';
    document.getElementById('block-btn').style.display = 'inline-block';
    log(`Connected to ${peerName}`);
    // Share initial profile metadata
    conn.send({ type: 'META', pfp: myPfp });
  });

  conn.on('data', (d) => {
    if (d && d.type === 'META') {
      targetPeerPfp = d.pfp;
      document.getElementById('target-pfp-display').src = d.pfp;
      document.getElementById('target-pfp-display').style.display = 'inline-block';
    }
    if (d && d.type === 'MSG') {
      appendBubble(d.text, false, d.pfp || targetPeerPfp);
    }
  });

  conn.on('close', () => resetState());
}

document.getElementById('send').onclick = () => {
  const input = document.getElementById('msg');
  const text = input.value.trim();
  if (!text || !conn) return;
  conn.send({ type: 'MSG', text: text, pfp: myPfp });
  appendBubble(text, true, myPfp);
  input.value = '';
};

function appendBubble(text, isMe, pfp) {
  const logDiv = document.getElementById('log');
  const row = document.createElement('div');
  row.className = `bubble-row ${isMe ? 'me' : 'peer'}`;

  const img = document.createElement('img');
  img.className = 'pfp-small';
  img.src = pfp || myPfp;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerText = text;

  row.appendChild(img);
  row.appendChild(bubble);
  logDiv.appendChild(row);
  logDiv.scrollTop = logDiv.scrollHeight;
}

// BLOCK / REMOVE BUTTON
document.getElementById('block-btn').onclick = () => {
  if (!conn) return;
  const name = conn.peer.replace(PREFIX, '');
  if (confirm(`Block and remove ${name}?`)) {
    blockedList.push(name);
    saveStorage(BLOCKED_KEY, blockedList);
    conn.close();
    resetState();
    updateFriendsUI();
    updateDiscoveredUI();
  }
};

// VOICE & VIDEO CALLS
function startCall(isVideo) {
  if (!conn) return;
  navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo }).then((stream) => {
    localStream = stream;
    document.getElementById('local-video').srcObject = stream;
    const call = peer.call(conn.peer, stream);
    setupCallHandlers(call);
    document.getElementById('call-status-text').innerText = isVideo ? "Video Calling..." : "Voice Calling...";
    document.getElementById('media-modal').style.display = 'flex';
  }).catch(() => alert("Permission denied for audio/video."));
}

document.getElementById('voice-call-btn').onclick = () => startCall(false);
document.getElementById('video-call-btn').onclick = () => startCall(true);

function setupCallHandlers(call) {
  currentCall = call;
  call.on('stream', (remoteStream) => {
    document.getElementById('remote-video').srcObject = remoteStream;
    document.getElementById('remote-audio').srcObject = remoteStream;
    document.getElementById('call-status-text').innerText = "Call Active";
  });
  call.on('close', () => closeCallModal());
}

document.getElementById('end-call-modal-btn').onclick = () => {
  if (currentCall) currentCall.close();
  closeCallModal();
};

function closeCallModal() {
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  document.getElementById('media-modal').style.display = 'none';
  document.getElementById('remote-video').srcObject = null;
  document.getElementById('local-video').srcObject = null;
}

function resetState() {
  if (conn) { try{conn.close()}catch(e){} conn = null; }
  closeCallModal();
  document.getElementById('controls').style.display = 'none';
  document.getElementById('disc-btn').style.display = 'none';
  document.getElementById('voice-call-btn').style.display = 'none';
  document.getElementById('video-call-btn').style.display = 'none';
  document.getElementById('block-btn').style.display = 'none';
  document.getElementById('target-title').innerText = 'No Active Channel';
  document.getElementById('target-pfp-display').style.display = 'none';
  log("--- Channel Closed ---");
}

document.getElementById('disc-btn').onclick = () => resetState();

function log(txt) {
  const logDiv = document.getElementById('log');
  const div = document.createElement('div');
  div.style.textAlign = 'center';
  div.style.fontSize = '0.8rem';
  div.style.opacity = '0.7';
  div.innerText = txt;
  logDiv.appendChild(div);
  logDiv.scrollTop = logDiv.scrollHeight;
}
</script>
</body>
</html>
