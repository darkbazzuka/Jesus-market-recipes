<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesus Market — Text Reader</title>
    <style>
        body {
            background-color: #0d2818; /* Dark green background */
            color: #ecfdf5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #14532d;
            padding-bottom: 20px;
        }
        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 15px;
        }
        h1 {
            color: #f0fdf4;
            margin: 5px 0;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .file-list-pane {
            flex: 1;
            max-width: 300px;
        }
        .viewer-pane {
            flex: 2;
            background: #051c10;
            border: 1px solid #14532d;
            border-radius: 8px;
            padding: 20px;
            min-height: 300px;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
            color: #bbf7d0;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin: 8px 0;
            background: #064e3b;
            border: 1px solid #065f46;
            border-radius: 6px;
            transition: background 0.2s;
        }
        li:hover {
            background: #047857;
        }
        button.file-link {
            display: block;
            width: 100%;
            padding: 12px 16px;
            background: none;
            border: none;
            color: #a7f3d0;
            text-align: left;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }
        .status { color: #6ee7b7; font-style: italic; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="header">
        <!-- Make sure your logo file is uploaded to the repo as logo.png -->
        <img src="logo.jpg" alt="Jesus Market Logo" class="logo">
        <h1>Text Files</h1>
        <p id="status" class="status">Scanning repository for text files...</p>
    </div>

    <div class="container" id="main-container" style="display: none;">
        <div class="file-list-pane">
            <ul id="file-list"></ul>
        </div>
        <div class="viewer-pane" id="file-viewer">Select a text file from the left to read its contents.</div>
    </div>

    <script>
        const hostParts = window.location.hostname.split(".");
        const pathParts = window.location.pathname.split("/").filter(Boolean);

        const USERNAME = hostParts[0] === "darkbazzuka" ? "darkbazzuka" : (hostParts[0] || "darkbazzuka");
        const REPO = pathParts[0] || "/Jesus-market-recipes/blob/Html";

        const statusEl = document.getElementById("status");
        const listEl = document.getElementById("file-list");
        const viewerEl = document.getElementById("file-viewer");
        const containerEl = document.getElementById("main-container");

        async function loadTextFiles() {
            try {
                const repoResponse = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}`);
                if (!repoResponse.ok) throw new Error(`HTTP ${repoResponse.status}: Ensure repository is Public.`);
                const repoData = await repoResponse.json();
                const defaultBranch = repoData.default_branch;

                const treeResponse = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${defaultBranch}?recursive=1`);
                if (!treeResponse.ok) throw new Error("Could not read repository file tree.");
                const treeData = await treeResponse.json();

                // Filter for .txt files, completely ignoring any files containing 'readme'
                const txtFiles = treeData.tree.filter(item => {
                    if (item.type !== "blob") return false;
                    const lowerPath = item.path.toLowerCase();
                    const isTxt = lowerPath.endsWith(".txt");
                    const isReadme = lowerPath.includes("readme");
                    return isTxt && !isReadme;
                });

                if (txtFiles.length === 0) {
                    statusEl.textContent = "No text files found (excluding readmes).";
                    return;
                }

                statusEl.style.display = "none";
                containerEl.style.display = "flex";

                txtFiles.forEach(file => {
                    const li = document.createElement("li");
                    const btn = document.createElement("button");
                    btn.className = "file-link";
                    btn.textContent = file.path;
                    
                    btn.onclick = async () => {
                        viewerEl.textContent = `Loading ${file.path}...`;
                        try {
                            const rawRes = await fetch(`https://raw.githubusercontent.com/${USERNAME}/${REPO}/${defaultBranch}/${file.path}`);
                            if (!rawRes.ok) throw new Error("Failed to load file contents.");
                            const content = await rawRes.text();
                            viewerEl.textContent = content;
                        } catch (e) {
                            viewerEl.textContent = `Error reading file: ${e.message}`;
                        }
                    };

                    li.appendChild(btn);
                    listEl.appendChild(li);
                });

            } catch (err) {
                statusEl.className = "error";
                statusEl.textContent = `Error: ${err.message}`;
            }
        }

        loadTextFiles();
    </script>

</body>
</html>
