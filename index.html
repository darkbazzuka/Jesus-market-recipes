<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index of /Jesus-market-recipes</title>
    <style>
        body {
            background-color: #e8f5ec; /* Light green retro background */
            color: #004411;
            font-family: "Courier New", Courier, monospace;
            margin: 10px;
            font-size: 13px;
        }
        h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 20px;
            margin: 0 0 5px 0;
            color: #006622;
        }
        hr {
            border: 0;
            border-top: 1px solid #008833;
            margin: 5px 0;
        }
        /* Top Header Banner with 3D Rotating Cross */
        .header-banner {
            border: 1px solid #008833;
            background: #d4edd9;
            padding: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        #ascii-cross {
            font-family: "Courier New", Courier, monospace;
            font-size: 8px;
            line-height: 9px;
            background: #ffffff;
            color: #004411;
            border: 1px solid #008833;
            padding: 4px;
            width: 150px;
            height: 75px;
            overflow: hidden;
            text-align: center;
            margin: 0;
        }
        .banner-title {
            font-weight: bold;
            font-size: 15px;
            color: #004411;
            letter-spacing: 1px;
            text-align: center;
        }
        .ad-banner {
            border: 1px solid #008833;
            background: #d4edd9;
            padding: 5px;
            text-align: center;
            margin-bottom: 10px;
        }
        .ad-image {
            max-height: 150px;
            max-width: 100%;
            display: block;
            margin: 0 auto;
        }
        .search-box {
            margin: 10px 0;
        }
        .search-box input {
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            padding: 3px;
            width: 200px;
            border: 1px solid #008833;
            background: #ffffff;
            color: #004411;
        }
        .search-box button {
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            padding: 3px 6px;
            background: #00aa44;
            color: #ffffff;
            border: 1px solid #006622;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td, th {
            text-align: left;
            padding: 4px 5px;
            border-bottom: 1px dotted #a3d9b1;
        }
        th {
            background-color: #d4edd9;
            color: #006622;
        }
        a {
            color: #006622;
            text-decoration: underline;
        }
        a:visited {
            color: #4400aa;
        }
        .icon {
            width: 50px;
            color: #008833;
        }
        .embedded-image {
            max-width: 100%;
            height: auto;
            border: 1px solid #008833;
            margin: 10px 0;
            display: block;
        }
        address {
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            font-size: 11px;
            margin-top: 15px;
            color: #006622;
        }

        /* Mobile Responsive Adaptation */
        @media screen and (max-width: 600px) {
            body {
                margin: 5px;
                font-size: 12px;
            }
            .search-box input {
                width: 140px;
            }
            .ad-image {
                max-height: 120px;
            }
            td, th {
                padding: 6px 3px;
            }
            .header-banner {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Banner with 3D Rotating ASCII Cross -->
    <div class="header-banner">
        <pre id="ascii-cross">[LOADING 3D...]</pre>
        <div class="banner-title">WELCOME TO THE JESUS MARKET</div>
    </div>

    <!-- Ad Banner -->
    <div id="ad-banner" class="ad-banner">
        <div id="ad-container">[Loading ad...]</div>
    </div>

    <!-- Browser View -->
    <div id="browser-view">
        <h1 id="dir-heading">Index of /</h1>
        
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search item...">
            <button onclick="performSearch()">Search</button>
            <button onclick="clearSearch()" id="clear-btn" style="display:none;">Reset</button>
        </div>

        <hr>
        <table>
            <tr>
                <th class="icon">Type</th>
                <th>Name</th>
                <th style="width: 80px;">Size</th>
            </tr>
            <tbody id="file-table-body">
                <tr><td colspan="3">Scanning directory...</td></tr>
            </tbody>
        </table>
        <hr>
    </div>

    <!-- Reader View -->
    <div id="reader-view" style="display:none;">
        <h1><a href="javascript:void(0)" onclick="closeReader()">[Parent Directory]</a> &mdash; <span id="reader-title"></span></h1>
        <hr>
        <div id="reader-body" style="white-space: pre-wrap; line-height: 1.5;"></div>
        <hr>
    </div>

    <address>Jesus Market HTTP Server / Port 80</address>

    <script type="text/javascript">
        var USERNAME = "darkbazzuka";
        var REPO = "Jesus-market-recipes";
        var BRANCH = "Html";

        var tableBodyEl = document.getElementById("file-table-body");
        var dirHeadingEl = document.getElementById("dir-heading");
        var searchInputEl = document.getElementById("search-input");
        var clearBtnEl = document.getElementById("clear-btn");
        var browserViewEl = document.getElementById("browser-view");
        var readerViewEl = document.getElementById("reader-view");
        var readerTitleEl = document.getElementById("reader-title");
        var readerBodyEl = document.getElementById("reader-body");
        var adContainerEl = document.getElementById("ad-container");

        var validTree = [];
        var currentFolder = "";
        var adImages = [];
        var adInterval = null;
        var searchActive = false;

        // --- 3D Rotating ASCII Cross Engine ---
        var A = 0, B = 0, C = 0;
        function render3DCross() {
            var width = 34, height = 15;
            var b = [];
            var zBuffer = [];
            
            for (var k = 0; k < width * height; k++) {
                b[k] = ' ';
                zBuffer[k] = 0;
            }

            // Generate 3D points for a crucifix shape
            var points = [];
            // Vertical shaft
            for (var x = -1; x <= 1; x += 0.5) {
                for (var y = -3.5; y <= 3.5; y += 0.4) {
                    for (var z = -1; z <= 1; z += 0.5) {
                        points.push([x, y, z]);
                    }
                }
            }
            // Horizontal crossbar
            for (var x = -3; x <= 3; x += 0.4) {
                for (var y = 0.5; y <= 2; y += 0.5) {
                    for (var z = -1; z <= 1; z += 0.5) {
                        points.push([x, y, z]);
                    }
                }
            }

            var cA = Math.cos(A), sA = Math.sin(A);
            var cB = Math.cos(B), sB = Math.sin(B);
            var cC = Math.cos(C), sC = Math.sin(C);

            for (var i = 0; i < points.length; i++) {
                var p = points[i];
                var x = p[0], y = p[1], z = p[2];

                // Rotation X
                var y1 = y * cA - z * sA;
                var z1 = y * sA + z * cA;
                var x1 = x;

                // Rotation Y
                var x2 = x1 * cB + z1 * sB;
                var z2 = -x1 * sB + z1 * cB;
                var y2 = y1;

                // Rotation Z
                var x3 = x2 * cC - y2 * sC;
                var y3 = x2 * sC + y2 * cC;
                var z3 = z2;

                var ooz = 1 / (z3 + 5);
                var xp = Math.floor(width / 2 + 10 * ooz * x3);
                var yp = Math.floor(height / 2 + 5 * ooz * y3);

                var idx = xp + yp * width;
                if (idx >= 0 && idx < width * height) {
                    if (ooz > zBuffer[idx]) {
                        zBuffer[idx] = ooz;
                        var luminance = Math.floor((z3 + 2) * 2);
                        var chars = ".,-~:;=!*#$@";
                        if (luminance < 0) luminance = 0;
                        if (luminance >= chars.length) luminance = chars.length - 1;
                        b[idx] = chars[luminance];
                    }
                }
            }

            var output = "";
            for (var k = 0; k < width * height; k++) {
                output += b[k];
                if ((k + 1) % width === 0) output += "\n";
            }
            var crossEl = document.getElementById("ascii-cross");
            if (crossEl) crossEl.innerHTML = output;

            A += 0.05;
            B += 0.03;
            C += 0.02;
        }
        setInterval(render3DCross, 50);

        // --- Repository & Directory Engine ---
        function init() {
            var url = "https://api.github.com/repos/" + USERNAME + "/" + REPO + "/git/trees/" + BRANCH + "?recursive=1";
            
            var xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            
                            // Parse ads
                            for (var i = 0; i < data.tree.length; i++) {
                                var item = data.tree[i];
                                if (item.type === "blob" && item.path.toLowerCase().slice(-4) === ".ads") {
                                    adImages.push("https://raw.githubusercontent.com/" + USERNAME + "/" + REPO + "/" + BRANCH + "/" + item.path);
                                }
                            }
                            setupAds();

                            // Allow all folders and valid .txt files
                            for (var j = 0; j < data.tree.length; j++) {
                                var node = data.tree[j];
                                var parts = node.path.split("/");
                                var name = parts[parts.length - 1];
                                var lowerName = name.toLowerCase();

                                if (node.type === "tree") {
                                    validTree.push(node);
                                } else if (node.type === "blob") {
                                    if (lowerName.slice(-4) !== ".txt" || lowerName.indexOf("readme") !== -1 || lowerName === "index.html") continue;
                                    validTree.push(node);
                                }
                            }

                            renderDirectory();
                        } catch (e) {
                            tableBodyEl.innerHTML = '<tr><td colspan="3" style="color:red;">Parse error.</td></tr>';
                        }
                    } else {
                        tableBodyEl.innerHTML = '<tr><td colspan="3" style="color:red;">Connection failed.</td></tr>';
                    }
                }
            };
            xhr.send();
        }

        function renderDirectory() {
            dirHeadingEl.innerHTML = "Index of /" + currentFolder;
            tableBodyEl.innerHTML = "";

            if (currentFolder !== "" && !searchActive) {
                var trUp = document.createElement("tr");
                trUp.innerHTML = '<td class="icon">[📁]</td><td><a href="javascript:void(0)" onclick="goUp()">Parent Directory/</a></td><td>-</td>';
                tableBodyEl.appendChild(trUp);
            }

            var itemsToShow = [];

            if (searchActive) {
                var query = searchInputEl.value.toLowerCase();
                for (var i = 0; i < validTree.length; i++) {
                    var rawName = validTree[i].path.split("/").pop();
                    var cleanName = rawName.replace(/\.txt$/i, "").toLowerCase();
                    if (cleanName.indexOf(query) !== -1) {
                        itemsToShow.push(validTree[i]);
                    }
                }
            } else {
                for (var j = 0; j < validTree.length; j++) {
                    var item = validTree[j];
                    var parts = item.path.split("/");
                    var parentPath = parts.slice(0, -1).join("/");
                    if (parentPath === currentFolder) {
                        itemsToShow.push(item);
                    }
                }
            }

            if (itemsToShow.length === 0) {
                tableBodyEl.innerHTML = '<tr><td colspan="3"><i>No entries found.</i></td></tr>';
                return;
            }

            for (var k = 0; k < itemsToShow.length; k++) {
                var entry = itemsToShow[k];
                var tr = document.createElement("tr");
                var segments = entry.path.split("/");
                var fileName = segments[segments.length - 1];

                if (entry.type === "tree") {
                    tr.innerHTML = '<td class="icon">[📁]</td><td><a href="javascript:void(0)" onclick="openFolder(\'' + entry.path + '\')">' + fileName + '/</a></td><td>-</td>';
                } else {
                    var displayName = fileName.replace(/\.txt$/i, "");
                    var sizeStr = entry.size ? entry.size + " B" : "-";
                    tr.innerHTML = '<td class="icon">[📄]</td><td><a href="javascript:void(0)" onclick="openFile(\'' + entry.path + '\', \'' + displayName + '\')">' + displayName + '</a></td><td>' + sizeStr + '</td>';
                }
                tableBodyEl.appendChild(tr);
            }
        }

        function openFolder(path) {
            currentFolder = path;
            searchActive = false;
            searchInputEl.value = "";
            clearBtnEl.style.display = "none";
            renderDirectory();
        }

        function goUp() {
            var parts = currentFolder.split("/");
            parts.pop();
            currentFolder = parts.join("/");
            renderDirectory();
        }

        function performSearch() {
            if (searchInputEl.value.trim() === "") return;
            searchActive = true;
            clearBtnEl.style.display = "inline";
            renderDirectory();
        }

        function clearSearch() {
            searchInputEl.value = "";
            searchActive = false;
            clearBtnEl.style.display = "none";
            renderDirectory();
        }

        function openFile(path, displayName) {
            browserViewEl.style.display = "none";
            readerViewEl.style.display = "block";
            readerTitleEl.innerHTML = displayName;
            readerBodyEl.innerHTML = "Loading file...";

            var fileUrl = "https://raw.githubusercontent.com/" + USERNAME + "/" + REPO + "/" + BRANCH + "/" + path;
            var rxhr = new XMLHttpRequest();
            rxhr.open("GET", fileUrl, true);
            rxhr.onreadystatechange = function() {
                if (rxhr.readyState === 4) {
                    if (rxhr.status === 200) {
                        var text = rxhr.responseText;
                        readerBodyEl.innerHTML = "";
                        var lines = text.split("\n");

                        for (var i = 0; i < lines.length; i++) {
                            var line = lines[i];
                            var trimmed = line.replace(/^\s+|\s+$/g, "");
                            
                            // Skip THUMBIMAGE line
                            if (trimmed.toUpperCase().indexOf("THUMBIMAGE:") === 0) continue;

                            // Check RENDER IMAGE
                            if (trimmed.toUpperCase().indexOf("RENDER IMAGE") === 0) {
                                var match = trimmed.match(/\*(.*?)\*/);
                                if (match && match[1]) {
                                    var img = document.createElement("img");
                                    img.src = match[1];
                                    img.className = "embedded-image";
                                    readerBodyEl.appendChild(img);
                                }
                            } else {
                                var p = document.createElement("div");
                                p.innerText = line === "" ? "\u00A0" : line;
                                readerBodyEl.appendChild(p);
                            }
                        }
                    } else {
                        readerBodyEl.innerHTML = "Error loading file.";
                    }
                }
            };
            rxhr.send();
        }

        function closeReader() {
            readerViewEl.style.display = "none";
            browserViewEl.style.display = "block";
        }

        function setupAds() {
            if (adImages.length === 0) {
                document.getElementById("ad-banner").style.display = "none";
                return;
            }
            function rotate() {
                var rand = adImages[Math.floor(Math.random() * adImages.length)];
                adContainerEl.innerHTML = '<img src="' + rand + '" class="ad-image" alt="Ad">';
            }
            rotate();
            if (adInterval) clearInterval(adInterval);
            adInterval = setInterval(rotate, 20000);
        }

        init();
    </script>
</body>
</html>
