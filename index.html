<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesus Market [SECURE ARCHIVE]</title>
    <style>
        * { box-sizing: border-box; }

        body {
            background: #000000;
            color: #00ff66;
            font-family: "Courier New", Courier, monospace;
            max-width: 900px;
            margin: 10px auto;
            padding: 0 10px;
        }

        /* ===== 2000s Underground Header ===== */
        .header {
            background: #050f07;
            border: 2px solid #00ff66;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .logo {
            height: 40px;
            width: auto;
            border: 1px solid #00ff66;
        }

        .search {
            flex-grow: 1;
            display: flex;
            gap: 5px;
        }

        .search input {
            flex-grow: 1;
            padding: 8px 12px;
            background: #000000;
            border: 1px solid #00ff66;
            outline: none;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            color: #00ff66;
        }

        .search input::placeholder { color: #005522; }

        .search button {
            background: #00ff66;
            color: #000000;
            border: none;
            padding: 0 15px;
            cursor: pointer;
            font-weight: bold;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
        }

        .search button:hover { background: #00cc52; }

        /* ===== Ad Banner ===== */
        .ad-banner {
            background: #050f07;
            border: 2px solid #00ff66;
            padding: 10px;
            text-align: center;
            margin-bottom: 10px;
        }

        .ad-image {
            max-height: 180px;
            max-width: 100%;
            object-fit: contain;
            border: 1px dashed #00ff66;
        }

        /* ===== Main Content Area ===== */
        .content {
            background: #050f07;
            border: 2px solid #00ff66;
            padding: 15px;
            min-height: 350px;
        }

        /* ===== Scrollable Item Grid ===== */
        .grid-container {
            max-height: 480px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Custom scrollbar for 2000s feel */
        .grid-container::-webkit-scrollbar {
            width: 8px;
        }
        .grid-container::-webkit-scrollbar-track {
            background: #000000;
            border: 1px solid #005522;
        }
        .grid-container::-webkit-scrollbar-thumb {
            background: #00ff66;
        }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
        }

        .item-card {
            background: #000000;
            border: 1px solid #00ff66;
            padding: 8px;
            cursor: pointer;
            text-align: center;
            transition: background 0.1s;
        }

        .item-card:hover {
            background: #00220c;
            border-color: #ffffff;
        }

        .item-thumb {
            width: 100%;
            height: 110px;
            object-fit: cover;
            background: #050f07;
            margin-bottom: 6px;
            border: 1px solid #005522;
        }

        .item-title {
            font-size: 12px;
            font-weight: bold;
            color: #00ff66;
            word-break: break-all;
            margin: 0;
        }

        /* ===== Single Item View ===== */
        .item-view { display: none; }

        .back-btn {
            background: #000000;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 6px 14px;
            cursor: pointer;
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .back-btn:hover {
            background: #00ff66;
            color: #000000;
        }

        .view-title {
            margin: 0 0 10px 0;
            color: #ffffff;
            font-size: 18px;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 5px;
            word-break: break-word;
        }

        .item-description {
            font-size: 13px;
            line-height: 1.6;
            color: #aaffcc;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .embedded-render-image {
            max-width: 100%;
            height: auto;
            border: 1px solid #00ff66;
            margin: 10px 0;
            display: block;
        }

        /* ===== Status & Footer ===== */
        .status-msg {
            text-align: center;
            color: #005522;
            font-style: italic;
            padding: 30px;
        }

        .error-msg { color: #ff3333 !important; }

        .footer {
            text-align: center;
            color: #005522;
            font-size: 11px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .item-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <img src="logo.jpg" alt="Jesus Market" class="logo" onerror="this.style.display='none'">
        <div class="search">
            <input type="text" id="search-input" placeholder="SEARCH DIRECTORY...">
            <button>FIND</button>
        </div>
    </div>

    <!-- Ad Banner -->
    <div class="ad-banner" id="ad-banner">
        <div id="ad-container"><span class="status-msg" style="font-size: 11px;">[LOADING AD FEED...]</span></div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <!-- Grid View with Scrollbar -->
        <div id="grid-view">
            <div class="grid-container">
                <div id="item-grid" class="item-grid">
                    <div class="status-msg">[SCANNING REPOSITORY FILES...]</div>
                </div>
            </div>
        </div>

        <!-- Single Item Detail View -->
        <div id="item-view" class="item-view">
            <button class="back-btn" onclick="showGrid()">&lt; BACK TO LISTINGS</button>
            <h2 class="view-title" id="view-title"></h2>
            <div id="view-content" class="item-description"></div>
        </div>
    </div>

    <div class="footer">&gt;&gt;&gt; JESUS MARKET // SECURE WORKBENCH NODE &lt;&lt;&lt;</div>

    <script>
        const USERNAME = "darkbazzuka";
        const REPO = "Jesus-market-recipes";
        const BRANCH = "Html";

        const itemGridEl = document.getElementById("item-grid");
        const gridViewEl = document.getElementById("grid-view");
        const itemViewEl = document.getElementById("item-view");
        const viewTitleEl = document.getElementById("view-title");
        const viewContentEl = document.getElementById("view-content");
        const searchInputEl = document.getElementById("search-input");
        const adContainerEl = document.getElementById("ad-container");

        let allFiles = [];
        let adImages = [];
        let adInterval = null;

        async function init() {
            try {
                const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`);
                if (!res.ok) throw new Error("CONNECTION FAILED.");
                const data = await res.json();

                allFiles = data.tree.filter(item => {
                    if (item.type !== "blob") return false;
                    const p = item.path.toLowerCase();
                    return p.endsWith(".txt") && !p.includes("readme") && !p.includes("index.html");
                });

                adImages = data.tree.filter(item => {
                    if (item.type !== "blob") return false;
                    return item.path.toLowerCase().endsWith(".ads");
                }).map(file => `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${file.path}`);

                setupAds();

                if (allFiles.length === 0) {
                    itemGridEl.innerHTML = `<div class="status-msg" style="grid-column: 1/-1;">NO LISTINGS FOUND.</div>`;
                    return;
                }

                for (let file of allFiles) {
                    try {
                        const fileRes = await fetch(`https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${file.path}`);
                        if (fileRes.ok) {
                            const text = await fileRes.text();
                            file.cachedContent = text;
                            const match = text.match(/THUMBIMAGE:\s*\*(.*?)\*/i);
                            file.thumbnailUrl = match ? match[1].trim() : null;
                        }
                    } catch (e) {
                        file.cachedContent = "";
                        file.thumbnailUrl = null;
                    }
                }

                renderGrid(allFiles);

                searchInputEl.oninput = () => {
                    const q = searchInputEl.value.toLowerCase();
                    const filtered = allFiles.filter(f => f.path.toLowerCase().includes(q));
                    renderGrid(filtered);
                };

            } catch (err) {
                itemGridEl.innerHTML = `<div class="status-msg error-msg" style="grid-column: 1/-1;">ERROR: ${err.message}</div>`;
            }
        }

        function renderGrid(files) {
            itemGridEl.innerHTML = "";
            if (files.length === 0) {
                itemGridEl.innerHTML = `<div class="status-msg" style="grid-column: 1/-1;">NO MATCHING ITEMS.</div>`;
                return;
            }

            files.forEach(file => {
                const card = document.createElement("div");
                card.className = "item-card";

                const thumb = file.thumbnailUrl || "logo.jpg";

                card.innerHTML = `
                    <img src="${thumb}" class="item-thumb" alt="Thumb" onerror="this.src='https://github.com/darkbazzuka/Jesus-market-recipes/blob/Html/logo.jpg'">
                    <p class="item-title">${file.path}</p>
                `;

                card.onclick = () => openItem(file);
                itemGridEl.appendChild(card);
            });
        }

        function openItem(file) {
            gridViewEl.style.display = "none";
            itemViewEl.style.display = "block";
            viewTitleEl.textContent = file.path;
            viewContentEl.innerHTML = "";

            const lines = (file.cachedContent || "").split("\n");

            lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed.match(/^THUMBIMAGE:/i)) return;

                const match = trimmed.match(/^RENDER IMAGE\s*\*(.*?)\*$/i);
                if (match) {
                    const imgUrl = match[1].trim();
                    const img = document.createElement("img");
                    img.src = imgUrl;
                    img.className = "embedded-render-image";
                    img.onerror = () => { img.alt = `[FAILED TO LOAD: ${imgUrl}]`; };
                    viewContentEl.appendChild(img);
                } else {
                    const p = document.createElement("p");
                    p.style.margin = "0 0 10px 0";
                    p.textContent = line;
                    viewContentEl.appendChild(p);
                }
            });

            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function showGrid() {
            itemViewEl.style.display = "none";
            gridViewEl.style.display = "block";
        }

        function setupAds() {
            if (adImages.length === 0) {
                document.getElementById("ad-banner").style.display = "none";
                return;
            }

            function rotateAd() {
                const randomUrl = adImages[Math.floor(Math.random() * adImages.length)];
                adContainerEl.innerHTML = `<img src="${randomUrl}" alt="Ad" class="ad-image">`;
            }

            rotateAd();
            if (adInterval) clearInterval(adInterval);
            adInterval = setInterval(rotateAd, 20000);
        }

        init();
    </script>

</body>
</html>
