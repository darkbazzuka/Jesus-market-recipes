<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesus Market</title>
    <style>
        * { box-sizing: border-box; }

        body {
            background: linear-gradient(160deg, #1a0b2e 0%, #0f1f17 100%);
            color: #ecfdf5;
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* ===== Header ===== */
        .header {
            background: rgba(30, 15, 50, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #4c1d95;
            border-radius: 12px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 4px 20px rgba(88, 28, 135, 0.25);
        }

        .logo {
            height: 42px;
            width: auto;
            border-radius: 6px;
        }

        .search {
            flex-grow: 1;
            display: flex;
            gap: 8px;
        }

        .search input {
            flex-grow: 1;
            padding: 10px 16px;
            background: rgba(15, 31, 23, 0.8);
            border: 1px solid #4c1d95;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
            color: #ecfdf5;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search input:focus {
            border-color: #34d399;
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15);
        }

        .search input::placeholder { color: #a78bfa; }

        .search button {
            background: linear-gradient(135deg, #7c3aed, #059669);
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .search button:hover { opacity: 0.9; }
        .search button:active { transform: scale(0.97); }

        /* ===== Ad Banner ===== */
        .ad-banner {
            background: rgba(30, 15, 50, 0.6);
            border: 1px solid #4c1d95;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin-top: 14px;
        }

        .ad-image {
            max-height: 220px;
            max-width: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        /* ===== Main Content ===== */
        .content {
            background: rgba(15, 31, 23, 0.5);
            border: 1px solid #3b2a5e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 14px;
            min-height: 300px;
        }

        /* ===== Item Grid ===== */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 14px;
        }

        .item-card {
            background: rgba(30, 15, 50, 0.6);
            border: 1px solid #3b2a5e;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .item-card:hover {
            border-color: #34d399;
            box-shadow: 0 6px 18px rgba(52, 211, 153, 0.2);
            transform: translateY(-3px);
        }

        .item-thumb {
            width: 100%;
            height: 130px;
            object-fit: cover;
            border-radius: 8px;
            background: #1a0b2e;
            margin-bottom: 10px;
            border: 1px solid #3b2a5e;
        }

        .item-title {
            font-size: 13px;
            font-weight: 600;
            color: #6ee7b7;
            word-break: break-all;
            margin: 0;
            line-height: 1.4;
        }

        /* ===== Single Item View ===== */
        .item-view { display: none; }

        .back-btn {
            background: transparent;
            color: #a78bfa;
            border: 1px solid #4c1d95;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #4c1d95;
            color: #fff;
        }

        .view-title {
            margin: 0 0 14px 0;
            color: #f0fdf4;
            font-size: 22px;
            font-weight: 700;
        }

        .divider {
            border: 0;
            border-top: 1px solid #4c1d95;
            margin: 0 0 16px 0;
        }

        .item-description {
            font-family: 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.8;
            color: #bbf7d0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .embedded-render-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #4c1d95;
            margin: 16px 0;
            display: block;
        }

        /* ===== Status / Misc ===== */
        .status-msg {
            text-align: center;
            color: #a78bfa;
            font-style: italic;
            padding: 40px;
        }

        .error-msg { color: #f87171 !important; }

        /* Subtle footer touch */
        .footer {
            text-align: center;
            color: #6d5a9c;
            font-size: 12px;
            padding: 18px 0 8px 0;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <img src="logo.jpg" alt="Jesus Market" class="logo" onerror="this.style.display='none'">
        <div class="search">
            <input type="text" id="search-input" placeholder="Search recipes & items...">
            <button>Search</button>
        </div>
    </div>

    <!-- Ad Banner -->
    <div class="ad-banner" id="ad-banner">
        <div id="ad-container"><span class="status-msg" style="font-size: 12px;">Loading sponsored ad...</span></div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <!-- Grid View -->
        <div id="grid-view">
            <div id="item-grid" class="item-grid">
                <div class="status-msg">Loading listings...</div>
            </div>
        </div>

        <!-- Single Item Detail View -->
        <div id="item-view" class="item-view">
            <button class="back-btn" onclick="showGrid()">&larr; Back to results</button>
            <h2 class="view-title" id="view-title"></h2>
            <hr class="divider">
            <div id="view-content" class="item-description"></div>
        </div>
    </div>

    <div class="footer">Jesus Market — free recipes you can make at home</div>

    <script>
        const USERNAME = "darkbazzuka";
        const REPO = "Jesus-market-recipes";
        const BRANCH = "Html";

        const itemGridEl = document.getElementById("item-grid");
        const gridViewEl = document.getElementById("grid-view");
        const itemViewEl = document.getElementById("item-view");
        const viewTitleEl = document.getElementById("view-title");
        const viewContentEl = document.getElementById("view-content");
        const searchInputEl = document.getElementById("search-input");
        const adContainerEl = document.getElementById("ad-container");

        let allFiles = [];
        let adImages = [];
        let adInterval = null;

        async function init() {
            try {
                const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`);
                if (!res.ok) throw new Error("Could not connect to repository.");
                const data = await res.json();

                allFiles = data.tree.filter(item => {
                    if (item.type !== "blob") return false;
                    const p = item.path.toLowerCase();
                    return p.endsWith(".txt") && !p.includes("readme") && !p.includes("index.html");
                });

                adImages = data.tree.filter(item => {
                    if (item.type !== "blob") return false;
                    return item.path.toLowerCase().endsWith(".ads");
                }).map(file => `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${file.path}`);

                setupAds();

                if (allFiles.length === 0) {
                    itemGridEl.innerHTML = `<div class="status-msg" style="grid-column: 1/-1;">No listings found.</div>`;
                    return;
                }

                for (let file of allFiles) {
                    try {
                        const fileRes = await fetch(`https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${file.path}`);
                        if (fileRes.ok) {
                            const text = await fileRes.text();
                            file.cachedContent = text;
                            const match = text.match(/THUMBIMAGE:\s*\*(.*?)\*/i);
                            file.thumbnailUrl = match ? match[1].trim() : null;
                        }
                    } catch (e) {
                        file.cachedContent = "";
                        file.thumbnailUrl = null;
                    }
                }

                renderGrid(allFiles);

                searchInputEl.oninput = () => {
                    const q = searchInputEl.value.toLowerCase();
                    const filtered = allFiles.filter(f => f.path.toLowerCase().includes(q));
                    renderGrid(filtered);
                };

            } catch (err) {
                itemGridEl.innerHTML = `<div class="status-msg error-msg" style="grid-column: 1/-1;">Error: ${err.message}</div>`;
            }
        }

        function renderGrid(files) {
            itemGridEl.innerHTML = "";
            if (files.length === 0) {
                itemGridEl.innerHTML = `<div class="status-msg" style="grid-column: 1/-1;">No matching items found.</div>`;
                return;
            }

            files.forEach(file => {
                const card = document.createElement("div");
                card.className = "item-card";

                const thumb = file.thumbnailUrl || "logo.jpg";

                card.innerHTML = `
                    <img src="${thumb}" class="item-thumb" alt="Item" onerror="this.src='https://github.com/darkbazzuka/Jesus-market-recipes/blob/Html/logo.jpg'">
                    <p class="item-title">${file.path}</p>
                `;

                card.onclick = () => openItem(file);
                itemGridEl.appendChild(card);
            });
        }

        function openItem(file) {
            gridViewEl.style.display = "none";
            itemViewEl.style.display = "block";
            viewTitleEl.textContent = file.path;
            viewContentEl.innerHTML = "";

            const lines = (file.cachedContent || "").split("\n");

            lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed.match(/^THUMBIMAGE:/i)) return;

                const match = trimmed.match(/^RENDER IMAGE\s*\*(.*?)\*$/i);
                if (match) {
                    const imgUrl = match[1].trim();
                    const img = document.createElement("img");
                    img.src = imgUrl;
                    img.className = "embedded-render-image";
                    img.onerror = () => { img.alt = `[Failed to load image: ${imgUrl}]`; };
                    viewContentEl.appendChild(img);
                } else {
                    const p = document.createElement("p");
                    p.style.margin = "0 0 10px 0";
                    p.textContent = line;
                    viewContentEl.appendChild(p);
                }
            });

            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function showGrid() {
            itemViewEl.style.display = "none";
            gridViewEl.style.display = "block";
        }

        function setupAds() {
            if (adImages.length === 0) {
                document.getElementById("ad-banner").style.display = "none";
                return;
            }

            function rotateAd() {
                const randomUrl = adImages[Math.floor(Math.random() * adImages.length)];
                adContainerEl.innerHTML = `<img src="${randomUrl}" alt="Ad" class="ad-image">`;
            }

            rotateAd();
            if (adInterval) clearInterval(adInterval);
            adInterval = setInterval(rotateAd, 20000);
        }

        init();
    </script>

</body>
</html>
