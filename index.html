
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository HTML Index</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        h1 {
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            color: #f0f6fc;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            transition: border-color 0.2s;
        }
        li:hover {
            border-color: #58a6ff;
        }
        a {
            display: block;
            padding: 12px 16px;
            color: #58a6ff;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .status {
            color: #8b949e;
            font-style: italic;
        }
        .error {
            color: #f85149;
        }
    </style>
</head>
<body>

    <h1 id="repo-title">HTML Files</h1>
    <p id="status" class="status">Scanning repository...</p>
    <ul id="file-list"></ul>

    <script>
        // ==========================================
        // REPLACE THESE TWO VALUES WITH YOUR DETAILS
        // ==========================================
        const USERNAME = "YOUR_USERNAME";
        const REPO = "YOUR_REPO_NAME";
        // ==========================================

        document.getElementById("repo-title").textContent = `${REPO} — HTML Files`;
        const statusEl = document.getElementById("status");
        const listEl = document.getElementById("file-list");

        async function loadHtmlFiles() {
            try {
                // 1. Get the default branch name (usually 'main' or 'master')
                const repoResponse = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}`);
                if (!repoResponse.ok) throw new Error("Repository not found. Check your USERNAME and REPO spelling, and make sure the repo is Public.");
                const repoData = await repoResponse.json();
                const defaultBranch = repoData.default_branch;

                // 2. Fetch the entire file tree recursively
                const treeResponse = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${defaultBranch}?recursive=1`);
                if (!treeResponse.ok) throw new Error("Could not fetch repository files.");
                const treeData = await treeResponse.json();

                // 3. Filter for .html files (excluding this index.html itself)
                const htmlFiles = treeData.tree.filter(item => 
                    item.type === "blob" && 
                    item.path.toLowerCase().endsWith(".html") && 
                    item.path.toLowerCase() !== "index.html"
                );

                // 4. Display the results
                if (htmlFiles.length === 0) {
                    statusEl.textContent = "No other HTML files found in this repository.";
                    return;
                }

                statusEl.style.display = "none";

                htmlFiles.forEach(file => {
                    const li = document.createElement("li");
                    const a = document.createElement("a");
                    // Relative path works directly on GitHub Pages
                    a.href = file.path; 
                    a.textContent = file.path;
                    li.appendChild(a);
                    listEl.appendChild(li);
                });

            } catch (err) {
                statusEl.className = "error";
                statusEl.textContent = `Error: ${err.message}`;
            }
        }

        loadHtmlFiles();
    </script>

</body>
</html>
