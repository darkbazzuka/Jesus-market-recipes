<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index of /Jesus-market-recipes</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: "Courier New", Courier, monospace;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
            font-size: 14px;
        }

        /* Top Ad Banner */
        .ad-banner {
            border: 1px solid #888;
            background: #f9f9f9;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .ad-image {
            max-height: 200px;
            max-width: 100%;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        /* Generic Directory Listing Header */
        h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 24px;
            margin: 0 0 10px 0;
            font-weight: bold;
        }

        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .controls input {
            font-family: "Courier New", Courier, monospace;
            padding: 4px 8px;
            border: 1px solid #767676;
            font-size: 13px;
            width: 250px;
        }

        hr {
            border: 0;
            border-top: 1px solid #888;
            margin: 8px 0;
        }

        /* Directory Table */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 4px 8px;
            border-bottom: 1px solid #ccc;
            font-weight: bold;
        }

        td {
            padding: 4px 8px;
        }

        tr:hover {
            background-color: #f0f0f0;
        }

        a.dir-link {
            color: #0000EE;
            text-decoration: underline;
            cursor: pointer;
        }

        a.dir-link:visited {
            color: #551A8B;
        }

        .icon {
            display: inline-block;
            width: 45px;
            color: #555;
            font-weight: bold;
        }

        /* Reader View */
        #reader-view {
            display: none;
            margin-top: 10px;
        }

        .reader-content {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            padding: 10px 0;
        }

        .embedded-render-image {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            display: block;
            border: 1px solid #ccc;
        }

        address {
            font-family: "Times New Roman", Times, serif;
            font-style: italic;
            font-size: 13px;
            color: #333;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Top Ad Banner -->
    <div class="ad-banner" id="ad-banner">
        <div id="ad-container">Loading ads...</div>
    </div>

    <!-- Directory Browser View -->
    <div id="browser-view">
        <h1 id="dir-heading">Index of /</h1>
        
        <div class="controls">
            <label for="search-input">Filter:</label>
            <input type="text" id="search-input" placeholder="type to filter...">
        </div>

        <hr>
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">Type</th>
                    <th>Name</th>
                    <th style="width: 100px;">Size</th>
                </tr>
            </thead>
            <tbody id="file-table-body">
                <tr><td colspan="3">Scanning directory...</td></tr>
            </tbody>
        </table>
        <hr>
    </div>

    <!-- File Reader View -->
    <div id="reader-view">
        <h1><a class="dir-link" onclick="closeReader()">[Return to Directory]</a> - <span id="reader-title"></span></h1>
        <hr>
        <div id="reader-body" class="reader-content"></div>
        <hr>
    </div>

    <address>Jesus Market Server at darkbazzuka.github.io Port 80</address>

    <script>
        const USERNAME = "darkbazzuka";
        const REPO = "Jesus-market-recipes";
        const BRANCH = "Html";

        const tableBodyEl = document.getElementById("file-table-body");
        const dirHeadingEl = document.getElementById("dir-heading");
        const searchInputEl = document.getElementById("search-input");
        const browserViewEl = document.getElementById("browser-view");
        const readerViewEl = document.getElementById("reader-view");
        const readerTitleEl = document.getElementById("reader-title");
        const readerBodyEl = document.getElementById("reader-body");
        const adContainerEl = document.getElementById("ad-container");

        let validTree = [];
        let currentFolder = ""; // "" means root directory
        let adImages = [];
        let adInterval = null;

        async function init() {
            try {
                const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                // 1. Collect .ADS images for the top banner
                adImages = data.tree
                    .filter(item => item.type === "blob" && item.path.toLowerCase().endsWith(".ads"))
                    .map(item => `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${item.path}`);
                setupAds();

                // 2. Filter tree for:
                //    - Folders (trees) ending in "RECIPE" (case-insensitive)
                //    - .txt files (blobs) at root OR inside a "RECIPE" folder (ignoring readmes)
                validTree = data.tree.filter(item => {
                    const parts = item.path.split("/");
                    const name = parts[parts.length - 1];
                    const lowerName = name.toLowerCase();

                    if (item.type === "tree") {
                        // Only allow folders ending with RECIPE (and ensure parent folders also end with RECIPE)
                        return parts.every(p => p.toLowerCase().endsWith("recipe"));
                    }

                    if (item.type === "blob") {
                        if (!lowerName.endsWith(".txt") || lowerName.includes("readme")) return false;
                        // Check if it's in root (parts.length === 1) OR all parent folders end in RECIPE
                        const folders = parts.slice(0, -1);
                        return folders.every(f => f.toLowerCase().endsWith("recipe"));
                    }

                    return false;
                });

                renderDirectory();

                searchInputEl.oninput = () => renderDirectory();

            } catch (err) {
                tableBodyEl.innerHTML = `<tr><td colspan="3" style="color:red;">Error loading index: ${err.message}</td></tr>`;
            }
        }

        function renderDirectory() {
            const query = searchInputEl.value.toLowerCase().trim();
            dirHeadingEl.textContent = `Index of /${currentFolder}`;
            tableBodyEl.innerHTML = "";

            // Add "Parent Directory" link if inside a subfolder
            if (currentFolder !== "" && query === "") {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="icon">[DIR]</td>
                    <td><a class="dir-link" onclick="goUp()">Parent Directory/</a></td>
                    <td>-</td>
                `;
                tableBodyEl.appendChild(tr);
            }

            let itemsToShow = [];

            if (query !== "") {
                // Global search across all allowed folders and .txt files
                itemsToShow = validTree.filter(item => {
                    const name = item.path.split("/").pop().replace(/\.txt$/i, "");
                    return name.toLowerCase().includes(query);
                });
            } else {
                // Show only immediate children of currentFolder
                itemsToShow = validTree.filter(item => {
                    const parts = item.path.split("/");
                    const parentPath = parts.slice(0, -1).join("/");
                    return parentPath === currentFolder;
                });
            }

            // Sort: Folders first, then files alphabetically
            itemsToShow.sort((a, b) => {
                if (a.type !== b.type) return a.type === "tree" ? -1 : 1;
                return a.path.localeCompare(b.path);
            });

            if (itemsToShow.length === 0) {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td colspan="3"><i>No entries found.</i></td>`;
                tableBodyEl.appendChild(tr);
                return;
            }

            itemsToShow.forEach(item => {
                const tr = document.createElement("tr");
                const rawName = item.path.split("/").pop();

                if (item.type === "tree") {
                    tr.innerHTML = `
                        <td class="icon">[DIR]</td>
                        <td><a class="dir-link">${rawName}/</a></td>
                        <td>-</td>
                    `;
                    tr.querySelector("a").onclick = () => {
                        currentFolder = item.path;
                        searchInputEl.value = "";
                        renderDirectory();
                    };
                } else {
                    // Strip .txt from display name
                    const cleanName = rawName.replace(/\.txt$/i, "");
                    const sizeText = item.size ? `${item.size} B` : "-";
                    tr.innerHTML = `
                        <td class="icon">[TXT]</td>
                        <td><a class="dir-link">${cleanName}</a></td>
                        <td>${sizeText}</td>
                    `;
                    tr.querySelector("a").onclick = () => openFile(item.path, cleanName);
                }

                tableBodyEl.appendChild(tr);
            });
        }

        function goUp() {
            const parts = currentFolder.split("/");
            parts.pop();
            currentFolder = parts.join("/");
            renderDirectory();
        }

        async function openFile(filePath, cleanName) {
            browserViewEl.style.display = "none";
            readerViewEl.style.display = "block";
            readerTitleEl.textContent = cleanName;
            readerBodyEl.textContent = "Loading...";

            try {
                const res = await fetch(`https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${filePath}`);
                if (!res.ok) throw new Error("Failed to fetch file.");
                const text = await res.text();

                readerBodyEl.innerHTML = "";
                const lines = text.split("\n");

                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed.match(/^THUMBIMAGE:/i)) return; // Hide thumbnail tag if present

                    const match = trimmed.match(/^RENDER IMAGE\s*\*(.*?)\*$/i);
                    if (match) {
                        const img = document.createElement("img");
                        img.src = match[1].trim();
                        img.className = "embedded-render-image";
                        img.onerror = () => { img.alt = `[Image failed to load: ${match[1].trim()}]`; };
                        readerBodyEl.appendChild(img);
                    } else {
                        const div = document.createElement("div");
                        div.textContent = line === "" ? "\u00A0" : line;
                        readerBodyEl.appendChild(div);
                    }
                });
            } catch (err) {
                readerBodyEl.textContent = `Error: ${err.message}`;
            }
        }

        function closeReader() {
            readerViewEl.style.display = "none";
            browserViewEl.style.display = "block";
        }

        function setupAds() {
            if (adImages.length === 0) {
                document.getElementById("ad-banner").style.display = "none";
                return;
            }
            function rotateAd() {
                const randomUrl = adImages[Math.floor(Math.random() * adImages.length)];
                adContainerEl.innerHTML = `<img src="${randomUrl}" alt="Sponsored Ad" class="ad-image">`;
            }
            rotateAd();
            if (adInterval) clearInterval(adInterval);
            adInterval = setInterval(rotateAd, 20000);
        }

        init();
    </script>

</body>
</html>
