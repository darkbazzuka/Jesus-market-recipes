<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesus Market — Big Text & Image Reader</title>
    <style>
        body {
            background-color: #0d2818; /* Dark green background */
            color: #ecfdf5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #14532d;
            padding-bottom: 20px;
        }
        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 15px;
        }
        h1 {
            color: #f0fdf4;
            margin: 5px 0;
        }
        .file-list-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }
        button.file-btn {
            background: #064e3b;
            border: 1px solid #065f46;
            color: #a7f3d0;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        button.file-btn:hover, button.file-btn.active {
            background: #047857;
            border-color: #059669;
            color: #ffffff;
        }
        .viewer-pane {
            background: #051c10;
            border: 1px solid #14532d;
            border-radius: 8px;
            padding: 30px;
            min-height: 400px;
            font-family: monospace;
            font-size: 15px;
            color: #bbf7d0;
            line-height: 1.8;
        }
        .rendered-text-line {
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
        }
        .embedded-render-image {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid #14532d;
            margin: 15px 0;
            display: block;
        }
        .status { color: #6ee7b7; font-style: italic; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.jpg" alt="Jesus Market Logo" class="logo">
        <h1>Text Files Reader</h1>
        <p id="status" class="status">Scanning repository for text files...</p>
    </div>

    <!-- File selection buttons listed neatly at the top -->
    <div class="file-list-bar" id="file-list"></div>

    <!-- Big full-width reader viewer pane below -->
    <div class="viewer-pane" id="file-viewer">Select a text file above to open it in the big reader.</div>

    <script>
        const USERNAME = "darkbazzuka";
        const REPO = "Jesus-market-recipes";
        const BRANCH = "Html";

        const statusEl = document.getElementById("status");
        const listEl = document.getElementById("file-list");
        const viewerEl = document.getElementById("file-viewer");

        async function loadTextFiles() {
            try {
                const treeResponse = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`);
                if (!treeResponse.ok) throw new Error(`HTTP ${treeResponse.status}: Could not read repository file tree from branch '${BRANCH}'.`);
                const treeData = await treeResponse.json();

                const txtFiles = treeData.tree.filter(item => {
                    if (item.type !== "blob") return false;
                    const lowerPath = item.path.toLowerCase();
                    const isTxt = lowerPath.endsWith(".txt");
                    const isReadme = lowerPath.includes("readme");
                    const isIndex = lowerPath.includes("index.html");
                    return isTxt && !isReadme && !isIndex;
                });

                if (txtFiles.length === 0) {
                    statusEl.textContent = "No text files found in the 'Html' branch (excluding readmes).";
                    return;
                }

                statusEl.style.display = "none";

                txtFiles.forEach(file => {
                    const btn = document.createElement("button");
                    btn.className = "file-btn";
                    btn.textContent = file.path;
                    
                    btn.onclick = async () => {
                        // Highlight active button
                        document.querySelectorAll('.file-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');

                        viewerEl.innerHTML = `Loading ${file.path}...`;
                        try {
                            const rawRes = await fetch(`https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${file.path}`);
                            if (!rawRes.ok) throw new Error("Failed to load file contents.");
                            const content = await rawRes.text();
                            
                            // Clear and parse content line by line for RENDER IMAGE tags
                            viewerEl.innerHTML = "";
                            const lines = content.split("\n");

                            lines.forEach(line => {
                                const trimmed = line.trim();
                                // Check if line matches: RENDER IMAGE *url*
                                const match = trimmed.match(/^RENDER IMAGE\s*\*(.*?)\*$/i);

                                if (match) {
                                    const imgUrl = match[1].trim();
                                    const img = document.createElement("img");
                                    img.src = imgUrl;
                                    img.className = "embedded-render-image";
                                    img.onerror = () => { img.alt = `[Failed to load image: ${imgUrl}]`; };
                                    viewerEl.appendChild(img);
                                } else {
                                    const p = document.createElement("p");
                                    p.className = "rendered-text-line";
                                    p.textContent = line;
                                    viewerEl.appendChild(p);
                                }
                            });

                        } catch (e) {
                            viewerEl.textContent = `Error reading file: ${e.message}`;
                        }
                    };

                    listEl.appendChild(btn);
                });

            } catch (err) {
                statusEl.className = "error";
                statusEl.textContent = `Error: ${err.message}`;
            }
        }

        loadTextFiles();
    </script>

</body>
</html>
