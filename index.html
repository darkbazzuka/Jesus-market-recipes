<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesus Market</title>
    <style>
        body {
            background-color: #eee;
            color: #333;
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 10px;
        }
        /* eBay Header Bar */
        .ebay-header {
            background: #fff;
            border-bottom: 1px solid #ccc;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 4px 4px 0 0;
        }
        .ebay-logo {
            max-height: 40px;
        }
        .ebay-search {
            flex-grow: 1;
            margin: 0 20px;
            display: flex;
        }
        .ebay-search input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #3665f3;
            border-radius: 20px 0 0 20px;
            outline: none;
            font-size: 14px;
        }
        .ebay-search button {
            background: #3665f3;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
            font-weight: bold;
        }
        /* Top Ad Banner */
        .ad-banner {
            background: #fff;
            border: 1px solid #ccc;
            border-top: none;
            padding: 10px;
            text-align: center;
        }
        .ad-image {
            max-height: 200px;
            max-width: 100%;
            object-fit: contain;
        }
        /* Main Container */
        .content-container {
            background: #fff;
            border: 1px solid #ccc;
            border-top: none;
            padding: 20px;
            border-radius: 0 0 4px 4px;
            min-height: 400px;
        }
        /* Item Grid */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .item-card {
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 10px;
            cursor: pointer;
            background: #fff;
            transition: box-shadow 0.2s;
            text-align: center;
        }
        .item-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            border-color: #3665f3;
        }
        .item-thumb {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 2px;
            background: #f9f9f9;
            margin-bottom: 8px;
        }
        .item-title {
            font-size: 13px;
            font-weight: bold;
            color: #0654ba;
            word-break: break-all;
            margin: 0;
        }
        /* Single Item View Page */
        .item-view {
            display: none;
        }
        .back-btn {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .back-btn:hover {
            background: #e0e0e0;
        }
        .item-description {
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .embedded-render-image {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 15px 0;
            display: block;
        }
        .status-msg {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 40px;
        }
    </style>
</head>
<body>

    <!-- eBay Header -->
    <div class="ebay-header">
        <img src="logo.jpg" alt="Jesus Market" class="ebay-logo" onerror="this.style.display='none'">
        <div class="ebay-search">
            <input type="text" id="search-input" placeholder="Search for anything">
            <button>Search</button>
        </div>
    </div>

    <!-- Ad Banner -->
    <div class="ad-banner" id="ad-banner">
        <div id="ad-container"><span class="status-msg" style="font-size: 12px;">Loading sponsored ad...</span></div>
    </div>

    <!-- Main Content Area -->
    <div class="content-container">
        
        <!-- Grid View of Items -->
        <div id="grid-view">
            <div id="item-grid" class="item-grid">
                <div class="status-msg">Loading listings...</div>
            </div>
        </div>

        <!-- Single Item Detail View -->
        <div id="item-view" class="item-view">
            <button class="back-btn" onclick="showGrid()">&lt; Back to results</button>
            <h2 id="view-title" style="margin-top: 0; color: #111;"></h2>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
            <div id="view-content" class="item-description"></div>
        </div>

    </div>

    <script>
        const USERNAME = "darkbazzuka";
        const REPO = "Jesus-market-recipes";
        const BRANCH = "Html";

        const itemGridEl = document.getElementById("item-grid");
        const gridViewEl = document.getElementById("grid-view");
        const itemViewEl = document.getElementById("item-view");
        const viewTitleEl = document.getElementById("view-title");
        const viewContentEl = document.getElementById("view-content");
        const searchInputEl = document.getElementById("search-input");
        const adContainerEl = document.getElementById("ad-container");

        let allFiles = [];
        let adImages = [];
        let adInterval = null;

        async function init() {
            try {
                const res = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`);
                if (!res.ok) throw new Error("Could not connect to repository.");
                const data = await res.json();

                // Find text files
                allFiles = data.tree.filter(item => {
                    if (item.type !== "blob") return false;
                    const p = item.path.toLowerCase();
                    return p.endsWith(".txt") && !p.includes("readme") && !p.includes("index.html");
                });

                // Find .ADS images
                adImages = data.tree.filter(item => {
                    if (item.type !== "blob") return false;
                    return item.path.toLowerCase().endsWith(".ads");
                }).map(file => `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${file.path}`);

                setupAds();

                if (allFiles.length === 0) {
                    itemGridEl.innerHTML = `<div class="status-msg" style="grid-column: 1/-1;">No listings found.</div>`;
                    return;
                }

                // Pre-fetch text to check for thumbnails
                for (let file of allFiles) {
                    try {
                        const fileRes = await fetch(`https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${file.path}`);
                        if (fileRes.ok) {
                            const text = await fileRes.text();
                            file.cachedContent = text;
                            const match = text.match(/THUMBIMAGE:\s*\*(.*?)\*/i);
                            file.thumbnailUrl = match ? match[1].trim() : null;
                        }
                    } catch (e) {
                        file.cachedContent = "";
                        file.thumbnailUrl = null;
                    }
                }

                renderGrid(allFiles);

                searchInputEl.oninput = (e) => {
                    const q = e.target.value.toLowerCase();
                    const filtered = allFiles.filter(f => f.path.toLowerCase().includes(q));
                    renderGrid(filtered);
                };

            } catch (err) {
                itemGridEl.innerHTML = `<div class="status-msg" style="grid-column: 1/-1; color: red;">Error: ${err.message}</div>`;
            }
        }

        function renderGrid(files) {
            itemGridEl.innerHTML = "";
            if (files.length === 0) {
                itemGridEl.innerHTML = `<div class="status-msg" style="grid-column: 1/-1;">No matching items found.</div>`;
                return;
            }

            files.forEach(file => {
                const card = document.createElement("div");
                card.className = "item-card";

                const thumb = file.thumbnailUrl ? file.thumbnailUrl : "logo.jpg";

                card.innerHTML = `
                    <img src="${thumb}" class="item-thumb" alt="Item" onerror="this.src='logo.jpg'">
                    <p class="item-title">${file.path}</p>
                `;

                card.onclick = () => openItem(file);
                itemGridEl.appendChild(card);
            });
        }

        function openItem(file) {
            gridViewEl.style.display = "none";
            itemViewEl.style.display = "block";
            viewTitleEl.textContent = file.path;
            viewContentEl.innerHTML = "Loading description...";

            const lines = (file.cachedContent || "").split("\n");
            viewContentEl.innerHTML = "";

            lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed.match(/^THUMBIMAGE:/i)) return; // Skip thumbnail tag in body

                const match = trimmed.match(/^RENDER IMAGE\s*\*(.*?)\*$/i);
                if (match) {
                    const imgUrl = match[1].trim();
                    const img = document.createElement("img");
                    img.src = imgUrl;
                    img.className = "embedded-render-image";
                    img.onerror = () => { img.alt = `[Failed to load image: ${imgUrl}]`; };
                    viewContentEl.appendChild(img);
                } else {
                    const p = document.createElement("p");
                    p.style.margin = "0 0 10px 0";
                    p.textContent = line;
                    viewContentEl.appendChild(p);
                }
            });
        }

        function showGrid() {
            itemViewEl.style.display = "none";
            gridViewEl.style.display = "block";
        }

        function setupAds() {
            if (adImages.length === 0) {
                document.getElementById("ad-banner").style.display = "none";
                return;
            }

            function rotateAd() {
                const randomUrl = adImages[Math.floor(Math.random() * adImages.length)];
                adContainerEl.innerHTML = `<img src="${randomUrl}" alt="Ad" class="ad-image">`;
            }

            rotateAd();
            if (adInterval) clearInterval(adInterval);
            adInterval = setInterval(rotateAd, 20000);
        }

        init();
    </script>

</body>
</html>
