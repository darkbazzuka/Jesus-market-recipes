<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesus-market-recipes</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        h1 {
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            color: #f0f6fc;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
        }
        li:hover {
            border-color: #58a6ff;
        }
        a {
            display: block;
            padding: 12px 16px;
            color: #58a6ff;
            text-decoration: none;
        }
        .status { color: #8b949e; }
        .error { color: #f85149; }
    </style>
</head>
<body>

    <h1 id="repo-title">Loading...</h1>
    <p id="status" class="status">Scanning repository...</p>
    <ul id="file-list"></ul>

    <script>
        // Automatically grabs username and repo from the GitHub Pages URL
        const hostParts = window.location.hostname.split(".");
        const pathParts = window.location.pathname.split("/").filter(Boolean);

        const USERNAME = hostParts[0] === "darkbazzuka" ? "darkbazzuka" : (hostParts[0] || "darkbazzuka");
        const REPO = pathParts[0] || "Jesus-market-recipes";

        document.getElementById("repo-title").textContent = `${REPO} — HTML Files`;
        const statusEl = document.getElementById("status");
        const listEl = document.getElementById("file-list");

        async function loadHtmlFiles() {
            try {
                const repoResponse = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}`);
                if (!repoResponse.ok) {
                    throw new Error(`HTTP ${repoResponse.status}: Make sure '${REPO}' is set to Public in Settings.`);
                }
                const repoData = await repoResponse.json();
                const defaultBranch = repoData.default_branch;

                const treeResponse = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${defaultBranch}?recursive=1`);
                if (!treeResponse.ok) {
                    throw new Error("Could not read file tree. Make sure you have at least one file committed.");
                }
                const treeData = await treeResponse.json();

                const htmlFiles = treeData.tree.filter(item => 
                    item.type === "blob" && 
                    item.path.toLowerCase().endsWith(".html") && 
                    item.path.toLowerCase() !== "index.html"
                );

                if (htmlFiles.length === 0) {
                    statusEl.textContent = "No other .html files found yet. Add some HTML files or folders to the repo!";
                    return;
                }

                statusEl.style.display = "none";

                htmlFiles.forEach(file => {
                    const li = document.createElement("li");
                    const a = document.createElement("a");
                    a.href = file.path; 
                    a.textContent = file.path;
                    li.appendChild(a);
                    listEl.appendChild(li);
                });

            } catch (err) {
                statusEl.className = "error";
                statusEl.textContent = `Error: ${err.message}`;
            }
        }

        loadHtmlFiles();
    </script>

</body>
</html>
