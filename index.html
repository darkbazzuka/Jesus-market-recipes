<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesus Market — The unrestricted workbench</title>
    <style>
        body {
            background-color: #0d2818; /* Dark green background */
            color: #ecfdf5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #14532d;
            padding-bottom: 20px;
        }
        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 15px;
        }
        h1 {
            color: #f0fdf4;
            margin: 5px 0;
        }
        /* Top Ad Banner Section */
        .ads-banner {
            background: #051c10;
            border: 1px solid #14532d;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        .ads-banner h3 {
            margin-top: 0;
            font-size: 14px;
            color: #6ee7b7;
            border-bottom: 1px solid #14532d;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .ad-image {
            max-width: 100%;
            max-height: 350px;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid #14532d;
        }
        /* Search Box */
        .search-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            background: #051c10;
            border: 1px solid #14532d;
            border-radius: 6px;
            color: #ecfdf5;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: #059669;
        }
        .file-list-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }
        button.file-btn {
            background: #064e3b;
            border: 1px solid #065f46;
            color: #a7f3d0;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        button.file-btn:hover, button.file-btn.active {
            background: #047857;
            border-color: #059669;
            color: #ffffff;
        }
        /* Bottom Reader Pane */
        .viewer-pane {
            background: #051c10;
            border: 1px solid #14532d;
            border-radius: 8px;
            padding: 30px;
            min-height: 400px;
            font-family: monospace;
            font-size: 15px;
            color: #bbf7d0;
            line-height: 1.8;
        }
        .rendered-text-line {
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
        }
        .embedded-render-image {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid #14532d;
            margin: 15px 0;
            display: block;
        }
        .status { color: #6ee7b7; font-style: italic; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.jpg" alt="Jesus Market Logo" class="logo">
        <h1>Welcome to the jesus market</h1>
        <p id="status" class="status">LOOKING FOR RECIPES</p>
    </div>

    <!-- 1. Top Ad Banner Screen (.ADS randomized every 20s) -->
    <div class="ads-banner" id="ads-banner">
        <h3>Sponsored Ads</h3>
        <div id="ad-container"><span class="status">Loading ads...</span></div>
    </div>

    <!-- 2. Search Bar -->
    <div class="search-container" id="search-container" style="display: none;">
        <input type="text" id="search-input" class="search-input" placeholder="Search recipes...">
    </div>

    <!-- 3. File selection buttons -->
    <div class="file-list-bar" id="file-list"></div>

    <!-- 4. Bottom Reader Pane -->
    <div class="viewer-pane" id="file-viewer">Click a recipe above to open it.</div>

    <script>
        const USERNAME = "darkbazzuka";
        const REPO = "Jesus-market-recipes";
        const BRANCH = "Html";

        const statusEl = document.getElementById("status");
        const listEl = document.getElementById("file-list");
        const viewerEl = document.getElementById("file-viewer");
        const adContainerEl = document.getElementById("ad-container");
        const searchContainerEl = document.getElementById("search-container");
        const searchInputEl = document.getElementById("search-input");

        let adImages = [];
        let adInterval = null;
        let allTxtFiles = [];

        async function initRepository() {
            try {
                const treeResponse = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/git/trees/${BRANCH}?recursive=1`);
                if (!treeResponse.ok) throw new Error(`HTTP ${treeResponse.status}: Could not read repository file tree from branch '${BRANCH}'.`);
                const treeData = await treeResponse.json();

                // 1. Find Text Recipes
                allTxtFiles = treeData.tree.filter(item => {
                    if (item.type !== "blob") return false;
                    const lowerPath = item.path.toLowerCase();
                    return lowerPath.endsWith(".txt") && !lowerPath.includes("readme") && !lowerPath.includes("index.html");
                });

                // 2. Find .ADS Image files
                adImages = treeData.tree.filter(item => {
                    if (item.type !== "blob") return false;
                    return item.path.toLowerCase().endsWith(".ads");
                }).map(file => `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${file.path}`);

                setupAdsSystem();

                if (allTxtFiles.length === 0) {
                    statusEl.textContent = "Sorry there are no Recipes";
                    return;
                }

                statusEl.style.display = "none";
                searchContainerEl.style.display = "block";

                renderRecipeButtons(allTxtFiles);

                // Search filtering logic
                searchInputEl.oninput = (e) => {
                    const query = e.target.value.toLowerCase();
                    const filtered = allTxtFiles.filter(file => file.path.toLowerCase().includes(query));
                    renderRecipeButtons(filtered);
                };

            } catch (err) {
                statusEl.className = "error";
                statusEl.textContent = `Error: ${err.message}`;
            }
        }

        function renderRecipeButtons(files) {
            listEl.innerHTML = "";
            if (files.length === 0) {
                listEl.innerHTML = `<span class="status">No matching recipes found.</span>`;
                return;
            }

            files.forEach(file => {
                const btn = document.createElement("button");
                btn.className = "file-btn";
                btn.textContent = file.path;
                
                btn.onclick = async () => {
                    document.querySelectorAll('.file-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    viewerEl.innerHTML = `Loading ${file.path}...`;
                    try {
                        const rawRes = await fetch(`https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${file.path}`);
                        if (!rawRes.ok) throw new Error("Failed to load file contents.");
                        const content = await rawRes.text();
                        
                        viewerEl.innerHTML = "";
                        const lines = content.split("\n");

                        lines.forEach(line => {
                            const trimmed = line.trim();
                            const match = trimmed.match(/^RENDER IMAGE\s*\*(.*?)\*$/i);

                            if (match) {
                                const imgUrl = match[1].trim();
                                const img = document.createElement("img");
                                img.src = imgUrl;
                                img.className = "embedded-render-image";
                                img.onerror = () => { img.alt = `[Failed to load image: ${imgUrl}]`; };
                                viewerEl.appendChild(img);
                            } else {
                                const p = document.createElement("p");
                                p.className = "rendered-text-line";
                                p.textContent = line;
                                viewerEl.appendChild(p);
                            }
                        });

                    } catch (e) {
                        viewerEl.textContent = `Error reading file: ${e.message}`;
                    }
                };

                listEl.appendChild(btn);
            });
        }

        // Setup random .ADS banner rotation every 20 seconds
        function setupAdsSystem() {
            if (adImages.length === 0) {
                adContainerEl.innerHTML = `<span class="status" style="font-size: 12px;">No .ADS images found in repo.</span>`;
                return;
            }

            function showRandomAd() {
                const randomIndex = Math.floor(Math.random() * adImages.length);
                const chosenUrl = adImages[randomIndex];
                adContainerEl.innerHTML = `<img src="${chosenUrl}" alt="Advertisement" class="ad-image">`;
            }

            showRandomAd();

            if (adInterval) clearInterval(adInterval);
            adInterval = setInterval(showRandomAd, 20000);
        }

        initRepository();
    </script>

</body>
</html>
